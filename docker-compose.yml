services:
  db:
    image: pgvector/pgvector:pg17
    container_name: konecto-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-konecto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-konecto}
      POSTGRES_DB: ${POSTGRES_DB:-konecto}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
