services:
  db:
    image: pgvector/pgvector:pg17
    container_name: konecto-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-konecto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-konecto}
      POSTGRES_DB: ${POSTGRES_DB:-konecto}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: konecto-backend
    env_file: .env
    environment:
      # Inside the compose network the DB is reached through the `db` service (overrides the value in .env).
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-konecto}:${POSTGRES_PASSWORD:-konecto}@db:5432/${POSTGRES_DB:-konecto}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
